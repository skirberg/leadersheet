name: Live brand kit
# After a push to main, waits for the deploy, then checks the live site: every file in /brand/kit.json is served with the
# sha256 the kit lists, and every icon, manifest icon and share card the home page names is one of them. Once a day too,
# so a deploy that never landed or a file that changed outside a build shows up as a red run, not as a stale icon.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Wait for the deploy
        if: github.event_name == 'push'
        run: sleep 240
      # The check needs no packages: Node's own fetch, crypto and zlib.
      - run: node scripts/brand-check.ts --live https://leadersheet.io
