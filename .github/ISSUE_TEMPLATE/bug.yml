name: Something is broken
description: A page, model, game or check that doesn't work as it should.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address where it happens.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: For example iPhone 15, Safari; or Windows, Chrome 131.
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
